# arXiv categories to monitor
# Full list: https://arxiv.org/category_taxonomy
categories:
  - hep-ph
  - hep-ex

# Papers fetched from arXiv per category before LLM selection
fetch_n: 50

# Papers selected by the LLM and included in the email per category
select_n: 10

user:
  name: Aritra

# Describe your research interests — used by the LLM to select and rank papers.
researcher_profile: |
  I'm a particle physicist and ML researcher working on
  classical and quantum machine learning. I am interested in anomaly detection at the LHC, jet tagging with novel ML architectures, and machine learning that exploits jet substructure. I am interested also in the applications of hypergraphs or hyper GNNs to LHC physics, be it for jet tagging or other applications. I am also looking into Lorentz equivariant architectures for quantum circuits, be it qubit or continuous-variable qumode systems. Prioritise papers directly relevant to these topics. I am less interested in more general ML papers without a clear connection to particle physics, or papers on quantum computing that don't have a clear application to ML or particle physics. Also prioritize papers from any of the following authors: Benjamin Nachman, David Shih, Jesse Thaler, Kyle Cranmer, Gregor Kasieczka, Michael Spannowsky, Tilman Plehn, Benedikt Maier, Louis Moureaux, Jennifer Ngadiuba, Philip Harris. Ignore any paper on which I (Aritra Bal) am a co-author, since I will already be aware of it.
 
# Controls how the digest email is written. Be as specific as you like about
# tone, structure, length of summaries, what to emphasise, etc.
output_instructions: |
  Write in a friendly but formal tone using first person, like a knowledgeable colleague passing
  on reading recommendations.
  Start with a short greeting using my name. The first part of the email should introduce the top picks of the day:
  here, across all categories combined, identify up to 5 most relevant papers. For each top pick, write 5-6 sentences explaining
  what is novel and exactly why it matters to my research interests. If it is from any of my starred authors, mention it.
  
  Then list the remaining papers per category, ranked from most to least relevant (based on my profile prompt),
  with just the title and arXiv link. No summaries needed for these.
  Close with a one-line informal sign-off.
  Format the entire output as Markdown: use **bold** for paper titles and key terms,
  *italics* where appropriate, and [title](url) syntax for all arXiv links so they
  are clickable. Use blank lines between sections. Do not use emojis or em dashes.

  All output must be formatted in a manner compatible with Mattermost or email. Therefore no unicode special characters. 

llm:
  # OpenAI-compatible API base URL
  base_url: https://ki-toolbox.scc.kit.edu/api
  model: kit.qwen3.5-397b-A17b

# Delivery method: "email" or "mattermost"
delivery: mattermost

email:
  subject: "[arXiv] Daily Digest"
  to: aritra.bal@kit.edu
  display_name: "Friendly arXiv Bot"
